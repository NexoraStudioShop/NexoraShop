<!-- ============================================================
NEXORA SHOP — PREMIUM STARTUP VERSION
CURSOR NORMAL + ANIMACIONES PREMIUM
============================================================ -->

<div id="nexora-root">

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

/* ============================================================
RESET
============================================================ */

html,
body{
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
  background:#0f0f0f !important;
  scroll-behavior:smooth;
}

body{
  position:relative;
}

/* ============================================================
ROOT
============================================================ */

#nexora-root{

  --gold:#FFD95A;
  --gold-light:#FFF0A6;
  --gold-dark:#D6A419;

  --white:#F5F5F5;

  width:100%;
  max-width:100%;
  overflow:hidden;

  font-family:'Inter',sans-serif;
  color:var(--white);

  background:
    radial-gradient(circle at top left, rgba(255,217,90,.18), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,217,90,.14), transparent 40%),
    linear-gradient(
      180deg,
      #231b10 0%,
      #171411 35%,
      #0f0f0f 100%
    );

  background-attachment:fixed;

  position:relative;
}

/* ============================================================
GLOBAL
============================================================ */

#nexora-root *{
  box-sizing:border-box;
  max-width:100%;
}

#nexora-root a{
  text-decoration:none;
  color:inherit;
}

#nexora-root ::selection{
  background:rgba(255,217,90,.25);
}

.hidden{
  opacity:0;
  transform:translateY(60px);
  transition:
    opacity 1s ease,
    transform 1s cubic-bezier(.2,.8,.2,1);
}

.show{
  opacity:1;
  transform:translateY(0);
}

/* ============================================================
FLOATING BACKGROUND
============================================================ */

#nexora-root::before{

  content:'';

  position:fixed;

  width:700px;
  height:700px;

  background:
    radial-gradient(
      circle,
      rgba(255,217,90,.14),
      transparent 70%
    );

  top:-260px;
  left:50%;

  transform:translateX(-50%);

  filter:blur(60px);

  animation:floatingGlow 9s ease-in-out infinite;

  pointer-events:none;

  z-index:0;
}

@keyframes floatingGlow{

  0%{
    transform:translateX(-50%) translateY(0px);
  }

  50%{
    transform:translateX(-50%) translateY(35px);
  }

  100%{
    transform:translateX(-50%) translateY(0px);
  }

}

/* ============================================================
NAVBAR
============================================================ */

#nexora-root .nav{

  position:sticky;
  top:0;

  z-index:999;

  backdrop-filter:blur(20px);

  background:rgba(18,18,18,.62);

  border-bottom:1px solid rgba(255,255,255,.06);

  box-shadow:
    0 10px 40px rgba(0,0,0,.22);
}

#nexora-root .nav-inner{

  max-width:1250px;

  margin:auto;

  padding:18px 28px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

#nexora-root .logo{

  font-family:'Space Grotesk',sans-serif;

  font-size:18px;

  font-weight:700;

  letter-spacing:.22em;
}

#nexora-root .logo span{
  color:var(--gold);
}

#nexora-root .nav-links{

  display:flex;

  gap:34px;

  color:#f2f2f2;

  font-size:14px;
}

#nexora-root .nav-links a{

  cursor:pointer;

  position:relative;

  transition:.3s;
}

#nexora-root .nav-links a::after{

  content:'';

  position:absolute;

  width:0%;
  height:1px;

  left:0;
  bottom:-8px;

  background:var(--gold);

  transition:.35s;
}

#nexora-root .nav-links a:hover{

  color:var(--gold);
}

#nexora-root .nav-links a:hover::after{
  width:100%;
}

@media(max-width:760px){

  #nexora-root .nav-links{
    display:none;
  }

}

/* ============================================================
BUTTONS
============================================================ */

#nexora-root .btn{

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:15px 30px;

  border-radius:999px;

  font-size:14px;
  font-weight:600;

  border:none;

  cursor:pointer;

  transition:
    transform .4s cubic-bezier(.2,.8,.2,1),
    box-shadow .4s,
    border-color .4s;
}

#nexora-root .btn-primary{

  background:
    linear-gradient(
      135deg,
      #FFF0A6,
      #FFD95A 50%,
      #D6A419
    );

  color:#111;

  box-shadow:
    0 18px 55px rgba(255,217,90,.34),
    0 0 35px rgba(255,217,90,.18);
}

#nexora-root .btn-primary:hover{

  transform:
    translateY(-5px)
    scale(1.03);

  box-shadow:
    0 30px 80px rgba(255,217,90,.42),
    0 0 55px rgba(255,217,90,.24);
}

#nexora-root .btn-ghost{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  color:#fff;

  backdrop-filter:blur(12px);
}

#nexora-root .btn-ghost:hover{

  border-color:rgba(255,217,90,.45);

  transform:translateY(-4px);
}

/* ============================================================
HERO
============================================================ */

#nexora-root .hero{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:140px 24px 120px;

  position:relative;
}

#nexora-root .hero-content{

  max-width:1050px;

  position:relative;

  z-index:2;
}

#nexora-root .eyebrow{

  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:10px 18px;

  border-radius:999px;

  background:rgba(255,255,255,.04);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(12px);

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.18em;

  color:#fff;

  margin-bottom:36px;
}

#nexora-root .dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--gold);

  box-shadow:
    0 0 18px var(--gold);
}

#nexora-root .hero h1{

  font-family:'Space Grotesk',sans-serif;

  font-size:clamp(62px,11vw,160px);

  line-height:.9;

  margin-bottom:28px;

  letter-spacing:-.04em;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #e7e7e7 50%,
      #9c9c9c
    );

  -webkit-background-clip:text;
  color:transparent;
}

#nexora-root .hero h1 .accent{

  background:
    linear-gradient(
      135deg,
      #FFF0A6,
      #FFD95A 45%,
      #D6A419
    );

  -webkit-background-clip:text;
  color:transparent;
}

#nexora-root .hero .sub{

  max-width:760px;

  margin:auto auto 48px;

  font-size:clamp(17px,1.8vw,22px);

  line-height:1.7;

  color:#e2e2e2;

  font-weight:300;
}

#nexora-root .hero-cta{

  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

/* ============================================================
SECTIONS
============================================================ */

#nexora-root section.block,
#nexora-root .about{

  max-width:1250px;

  margin:auto;

  padding:150px 28px;

  position:relative;
  z-index:2;
}

#nexora-root .section-head{

  text-align:center;

  margin-bottom:80px;
}

#nexora-root .section-head h2,
#nexora-root .about h2,
#nexora-root .cta-final h2{

  font-size:clamp(38px,5vw,64px);

  line-height:1.1;

  margin-bottom:18px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #d9d9d9
    );

  -webkit-background-clip:text;
  color:transparent;
}

/* ============================================================
PRODUCTS
============================================================ */

#nexora-root .products{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:28px;
}

@media(max-width:980px){

  #nexora-root .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:640px){

  #nexora-root .products{
    grid-template-columns:1fr;
  }

}

#nexora-root .card{

  position:relative;

  padding:26px;

  border-radius:30px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.03)
    );

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(16px);

  overflow:hidden;

  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    box-shadow .45s,
    border-color .45s;

  box-shadow:
    0 12px 40px rgba(0,0,0,.22);
}

#nexora-root .card:hover{

  transform:
    translateY(-10px)
    scale(1.015);

  border-color:rgba(255,217,90,.28);

  box-shadow:
    0 30px 80px rgba(0,0,0,.42),
    0 0 40px rgba(255,217,90,.10);
}

#nexora-root .mockup{

  aspect-ratio:4/3;

  border-radius:22px;

  margin-bottom:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at top left, #6d5425, #1a1a1a 72%);

  border:1px solid rgba(255,255,255,.05);
}

#nexora-root .icon{

  font-size:58px;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #FFF0A6,
      #FFD95A,
      #D6A419
    );

  -webkit-background-clip:text;
  color:transparent;
}

#nexora-root .card h3{

  font-size:24px;

  margin-bottom:10px;
}

#nexora-root .desc{

  color:#e4e4e4;

  margin-bottom:24px;

  line-height:1.7;

  font-size:14px;
}

#nexora-root .row{

  display:flex;
  align-items:center;
  justify-content:space-between;
}

#nexora-root .price{

  color:var(--gold);

  font-size:28px;

  font-weight:700;
}

#nexora-root .buy{

  padding:12px 18px;

  border-radius:999px;

  background:rgba(255,217,90,.10);

  border:1px solid rgba(255,217,90,.22);

  color:var(--gold);

  transition:.35s;

  cursor:pointer;
}

#nexora-root .buy:hover{

  background:rgba(255,217,90,.18);

  transform:translateY(-3px);
}

/* ============================================================
ABOUT
============================================================ */

#nexora-root .about{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:80px;

  align-items:center;
}

@media(max-width:900px){

  #nexora-root .about{
    grid-template-columns:1fr;
  }

}

#nexora-root .about p{

  color:#ececec;

  margin-bottom:18px;

  line-height:1.8;
}

#nexora-root .visual{

  aspect-ratio:1/1;

  border-radius:36px;

  background:
    linear-gradient(rgba(0,0,0,.10), rgba(0,0,0,.18)),
    url('https://i.postimg.cc/prwfX6Rh/eabdfe39-8d0c-474f-b03e-d105dcf436d5.png') center/cover no-repeat;

  border:1px solid rgba(255,217,90,.22);

  box-shadow:
    0 30px 90px rgba(0,0,0,.34);
}

#nexora-root .stats{

  display:flex;

  gap:40px;

  flex-wrap:wrap;

  margin-top:36px;
}

#nexora-root .num{

  color:var(--gold);

  font-size:34px;

  font-weight:700;
}

#nexora-root .lbl{

  color:#bfbfbf;

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.12em;
}

/* ============================================================
CTA
============================================================ */

#nexora-root .cta-final{

  margin:40px auto 140px;

  max-width:1100px;

  padding:100px 34px;

  border-radius:42px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(255,217,90,.14),
      rgba(255,255,255,.03)
    );

  border:1px solid rgba(255,217,90,.18);

  backdrop-filter:blur(18px);
}

#nexora-root .cta-final p{

  max-width:650px;

  margin:22px auto 40px;

  color:#ececec;

  line-height:1.8;
}

/* ============================================================
FOOTER
============================================================ */

#nexora-root footer{

  border-top:1px solid rgba(255,255,255,.06);

  padding:55px 24px;

  text-align:center;

  color:#bdbdbd;

  font-size:13px;
}

#nexora-root footer .links{

  display:flex;

  justify-content:center;

  gap:26px;

  margin:20px 0;

  flex-wrap:wrap;
}

#nexora-root footer .links a{

  transition:.3s;

  cursor:pointer;
}

#nexora-root footer .links a:hover{
  color:var(--gold);
}

</style>

<!-- NAV -->

<nav class="nav">

  <div class="nav-inner">

    <div class="logo">
      NEXORA <span>SHOP</span>
    </div>

    <div class="nav-links">

      <a onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
        Productos
      </a>

      <a onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">
        Nosotros
      </a>

      <a onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">
        Contacto
      </a>

    </div>

    <button class="btn btn-ghost"
      onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">

      Explorar

    </button>

  </div>

</nav>

<!-- HERO -->

<section class="hero">

  <div class="hero-content hidden">

    <div class="eyebrow">
      <span class="dot"></span>
      Plataforma Digital Premium
    </div>

    <h1>
      NEXORA <span class="accent">SHOP</span>
    </h1>

    <p class="sub">
      Tu tienda de productos digitales premium.
    </p>

    <div class="hero-cta">

      <button class="btn btn-primary"
        onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">

        Explorar la Shop →

      </button>

      <button class="btn btn-ghost"
        onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">

        Quiénes Somos

      </button>

    </div>

  </div>

</section>

<!-- REVEAL SCRIPT -->

<script>

const revealElements = document.querySelectorAll('.hidden');

const observer = new IntersectionObserver((entries)=>{

  entries.forEach(entry=>{

    if(entry.isIntersecting){

      entry.target.classList.add('show');

    }

  });

},{
  threshold:.12
});

revealElements.forEach(el=>{

  observer.observe(el);

});

</script>

</div>
