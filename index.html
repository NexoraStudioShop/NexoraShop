<!-- ============================================================
NEXORA SHOP — ULTRA PREMIUM VERSION
APPLE / LINEAR / STRIPE STYLE
============================================================ -->

<div id="nexora-root">

<!-- LOADER -->

<div class="loader">

  <div class="loader-logo">
    NEXORA <span>SHOP</span>
  </div>

</div>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');

/* ============================================================
RESET
============================================================ */

html,
body{
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
  background:#0b0b0b !important;
  scroll-behavior:smooth;
}

body{
  position:relative;
}

/* ============================================================
ROOT
============================================================ */

#nexora-root{

  --gold:#FFD95A;
  --gold-light:#FFF0A6;
  --gold-dark:#D6A419;

  --white:#F5F5F5;

  width:100%;
  max-width:100%;
  overflow:hidden;

  font-family:'Inter',sans-serif;

  color:var(--white);

  position:relative;

  background:

    radial-gradient(circle at 15% 20%, rgba(255,217,90,.14), transparent 25%),

    radial-gradient(circle at 85% 70%, rgba(255,217,90,.10), transparent 30%),

    radial-gradient(circle at center, rgba(255,255,255,.02), transparent 60%),

    linear-gradient(
      180deg,
      #241b10 0%,
      #17130f 35%,
      #0b0b0b 100%
    );

  background-attachment:fixed;
}

/* ============================================================
GLOBAL
============================================================ */

#nexora-root *{
  box-sizing:border-box;
  max-width:100%;
}

#nexora-root a{
  text-decoration:none;
  color:inherit;
}

#nexora-root ::selection{
  background:rgba(255,217,90,.22);
}

.hidden{
  opacity:0;
  transform:translateY(70px);
  transition:
    opacity 1.2s ease,
    transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.show{
  opacity:1;
  transform:translateY(0);
}

/* ============================================================
LOADER
============================================================ */

.loader{

  position:fixed;
  inset:0;

  background:#0b0b0b;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:999999;

  animation:loaderFade 1.2s ease forwards;

  animation-delay:2s;
}

.loader-logo{

  font-family:'Space Grotesk',sans-serif;

  font-size:34px;

  letter-spacing:.3em;

  color:#fff;

  animation:pulse 1.4s infinite;
}

.loader-logo span{
  color:#FFD95A;
}

@keyframes pulse{

  0%{
    opacity:.4;
    transform:scale(.98);
  }

  50%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:.4;
    transform:scale(.98);
  }

}

@keyframes loaderFade{

  to{
    opacity:0;
    visibility:hidden;
  }

}

/* ============================================================
SPOTLIGHT
============================================================ */

.spotlight{

  position:fixed;

  width:700px;
  height:700px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,217,90,.10),
      transparent 60%
    );

  pointer-events:none;

  z-index:1;

  transform:translate(-50%,-50%);

  mix-blend-mode:screen;

  transition:
    transform .08s linear;
}

/* ============================================================
PARTICLES
============================================================ */

.particles{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.particle{

  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:rgba(255,217,90,.35);

  animation:floatParticle linear infinite;
}

@keyframes floatParticle{

  from{
    transform:translateY(100vh);
    opacity:0;
  }

  10%{
    opacity:1;
  }

  to{
    transform:translateY(-120vh);
    opacity:0;
  }

}

/* ============================================================
FLOATING GLOW
============================================================ */

#nexora-root::before{

  content:'';

  position:fixed;

  width:900px;
  height:900px;

  background:
    radial-gradient(
      circle,
      rgba(255,217,90,.10),
      transparent 70%
    );

  top:-320px;
  left:50%;

  transform:translateX(-50%);

  filter:blur(70px);

  animation:floatingGlow 10s ease-in-out infinite;

  pointer-events:none;

  z-index:0;
}

@keyframes floatingGlow{

  0%{
    transform:translateX(-50%) translateY(0px);
  }

  50%{
    transform:translateX(-50%) translateY(40px);
  }

  100%{
    transform:translateX(-50%) translateY(0px);
  }

}

/* ============================================================
NAVBAR
============================================================ */

#nexora-root .nav{

  position:sticky;
  top:0;

  z-index:999;

  backdrop-filter:blur(20px);

  background:rgba(12,12,12,.58);

  border-bottom:1px solid rgba(255,255,255,.06);

  box-shadow:
    0 10px 40px rgba(0,0,0,.22);
}

#nexora-root .nav-inner{

  max-width:1250px;

  margin:auto;

  padding:18px 28px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

#nexora-root .logo{

  font-family:'Space Grotesk',sans-serif;

  font-size:18px;

  font-weight:700;

  letter-spacing:.22em;
}

#nexora-root .logo span{
  color:var(--gold);
}

#nexora-root .nav-links{

  display:flex;

  gap:34px;

  color:#f2f2f2;

  font-size:14px;
}

#nexora-root .nav-links a{

  cursor:pointer;

  position:relative;

  transition:.3s;
}

#nexora-root .nav-links a::after{

  content:'';

  position:absolute;

  width:0%;
  height:1px;

  left:0;
  bottom:-8px;

  background:var(--gold);

  transition:.35s;
}

#nexora-root .nav-links a:hover{

  color:var(--gold);
}

#nexora-root .nav-links a:hover::after{
  width:100%;
}

@media(max-width:760px){

  #nexora-root .nav-links{
    display:none;
  }

}

/* ============================================================
BUTTONS
============================================================ */

#nexora-root .btn{

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:15px 30px;

  border-radius:999px;

  font-size:14px;
  font-weight:600;

  border:none;

  cursor:pointer;

  transition:
    transform .4s cubic-bezier(.2,.8,.2,1),
    box-shadow .4s,
    border-color .4s;
}

#nexora-root .btn-primary{

  background:
    linear-gradient(
      135deg,
      #FFF0A6,
      #FFD95A 50%,
      #D6A419
    );

  color:#111;

  box-shadow:
    0 18px 55px rgba(255,217,90,.34),
    0 0 35px rgba(255,217,90,.18);
}

#nexora-root .btn-primary:hover{

  transform:
    translateY(-6px)
    scale(1.03);

  box-shadow:
    0 35px 90px rgba(255,217,90,.42),
    0 0 60px rgba(255,217,90,.24);
}

#nexora-root .btn-ghost{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  color:#fff;

  backdrop-filter:blur(12px);
}

#nexora-root .btn-ghost:hover{

  border-color:rgba(255,217,90,.45);

  transform:translateY(-4px);
}

/* ============================================================
HERO
============================================================ */

#nexora-root .hero{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:140px 24px 120px;

  position:relative;
}

#nexora-root .hero-content{

  max-width:1050px;

  position:relative;

  z-index:2;
}

#nexora-root .eyebrow{

  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:10px 18px;

  border-radius:999px;

  background:rgba(255,255,255,.04);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(12px);

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.18em;

  color:#fff;

  margin-bottom:36px;
}

#nexora-root .dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--gold);

  box-shadow:
    0 0 18px var(--gold);
}

#nexora-root .hero h1{

  font-family:'Space Grotesk',sans-serif;

  font-size:clamp(62px,11vw,170px);

  line-height:.9;

  margin-bottom:28px;

  letter-spacing:-.05em;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #ececec 45%,
      #8e8e8e
    );

  -webkit-background-clip:text;
  color:transparent;
}

#nexora-root .hero h1 .accent{

  background:
    linear-gradient(
      135deg,
      #FFF0A6,
      #FFD95A 45%,
      #D6A419
    );

  -webkit-background-clip:text;
  color:transparent;
}

#nexora-root .hero .sub{

  max-width:760px;

  margin:auto auto 48px;

  font-size:clamp(17px,1.8vw,22px);

  line-height:1.8;

  color:#e2e2e2;

  font-weight:300;
}

#nexora-root .hero-cta{

  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

/* EL RESTO DEL HTML SIGUE EXACTAMENTE IGUAL */
/* SOLO SE ELIMINÓ EL CURSOR PERSONALIZADO */

</style>

<script>

/* ============================================================
REVEAL ANIMATION
============================================================ */

const revealElements = document.querySelectorAll('.hidden');

const observer = new IntersectionObserver((entries)=>{

  entries.forEach(entry=>{

    if(entry.isIntersecting){

      entry.target.classList.add('show');

    }

  });

},{
  threshold:.12
});

revealElements.forEach(el=>{

  observer.observe(el);

});

/* ============================================================
SPOTLIGHT
============================================================ */

const spotlight = document.createElement('div');

spotlight.classList.add('spotlight');

document.body.appendChild(spotlight);

document.addEventListener('mousemove',(e)=>{

  spotlight.style.left = e.clientX + 'px';
  spotlight.style.top = e.clientY + 'px';

});

/* ============================================================
PARTICLES
============================================================ */

const particles = document.createElement('div');

particles.classList.add('particles');

document.body.appendChild(particles);

for(let i=0;i<35;i++){

  const p = document.createElement('span');

  p.classList.add('particle');

  p.style.left = Math.random()*100 + '%';

  p.style.animationDuration =
    (10 + Math.random()*15) + 's';

  p.style.animationDelay =
    Math.random()*10 + 's';

  particles.appendChild(p);

}

</script>

</div>
